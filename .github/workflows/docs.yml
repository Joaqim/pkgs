# Initially taken from [1], simplified by [2]:
# [1]: https://github.com/tgirlcloud/pkgs/blob/main/.github/workflows/docs.yml
# [2]: https://github.com/juspay/vira/blob/e93bc5344a11c573e6f1f6f33119855971edd46c/.github/workflows/website.yaml
name: Deploy docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "modules/**/*"
      - "docs/**/*"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: x86_64-linux
    steps:
      - name: Fail if workflow_dispatch is used on a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "This workflow should not be triggered with workflow_dispatch on a branch other than main"
          exit 1
      
      - uses: actions/checkout@v5
      - name: Build docs
        run: nix build -L ./docs#jqpkgs-docs -o ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs 
    steps: 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
